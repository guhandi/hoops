[project]
name = "hoops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.35", "anthropic>=0.40", "matplotlib>=3.9",
  "mutagen>=1.47", "pyyaml>=6.0", "python-dotenv>=1.0",
]

[project.scripts]
hoops = "hoops.cli:main"

[project.optional-dependencies]
cloud = ["modal>=1.0", "boto3>=1.34", "fastapi>=0.110", "python-multipart>=0.0.9"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoops"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not paid'"
markers = [
  "unit: pure functions, synthetic inputs",
  "parse: fixture transcripts -> shots, no network",
  "paid: hits paid APIs, run on demand",
]
