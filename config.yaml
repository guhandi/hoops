timezone: America/Los_Angeles     # EDIT to your timezone — in this file AND cloud/config.cloud.yaml
inbox: ~/Library/Mobile Documents/com~apple~CloudDocs/Capture/inbox
sessions_root: sessions
prefix: hoops

vocab_default: swish_brick
vocabularies:
  swish_brick:
    make: [swish, splash, make]
    miss: [brick, break, miss]
  make_miss:
    make: [make]
    miss: [miss]

isolation:
  low: 0.15
  high: 0.4

limits:
  min_duration_s: 5
  max_duration_s: 1200
  min_gap_s: 1.5
  max_gap_s: 120

transcriber:
  model: whisper-1

llm:
  model: claude-sonnet-5

email:
  from: you@example.com   # set GMAIL_ADDRESS in .env instead of editing this
  to: you@example.com     # (it overrides both from and to)
  smtp_host: smtp.gmail.com
  smtp_port: 465

profanity: [fuck, fucking, shit, damn, goddamn, bullshit, ass]

acoustics:                  # branch B — impact detection, independent of voice
  sr: 22050
  hop: 256
  n_fft: 1024
  hpss_margin_harmonic: 1.0
  hpss_margin_percussive: 4.0
  onset_delta: 0.4          # sweep-chosen — see docs/decisions/002-impact-detection-params.md
  min_spacing_frames: 15
  cluster_gap_s: 2.0
  envelope_hz: 15
  feature_win_s: 0.15

fusion:                     # pairing voice calls to impact clusters
  pair_min_s: 0.5
  pair_max_s: 4.0

gudata:                     # push session stats + per-shot rows to GuData (non-fatal stage)
  enabled: false            # flip on once GUDATA_* env vars are set (.env.example)
